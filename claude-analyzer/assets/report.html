/* ---------- tokens (dataviz reference palette; both modes selected) ---------- */
:root {
  color-scheme: light;
  --surface: #fcfcfb;
  --plane: #f9f9f7;
  --ink: #0b0b0b;
  --ink-2: #52514e;
  --muted: #898781;
  --grid: #e1e0d9;
  --axis: #c3c2b7;
  --border: rgba(11, 11, 11, 0.10);
  --wash: rgba(11, 11, 11, 0.035);
  --track: rgba(11, 11, 11, 0.07);
  /* categorical slots 1..6, in Category order — never cycled, never re-ordered */
  --c-Prompt: #2a78d6;
  --c-Toolcall: #eb6834;
  --c-MCP: #1baf7a;
  --c-Skill: #eda100;
  --c-Agent: #e87ba4;
  --c-Overhead: #008300;
  /* week-over-week direction cue: up = warmer, down = cooler (never status hues) */
  --delta-up: #9c4a1e;
  --delta-down: #285bac;
  --main-mark: #a9a89f;
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --surface: #1a1a19;
    --plane: #0d0d0d;
    --ink: #ffffff;
    --ink-2: #c3c2b7;
    --muted: #898781;
    --grid: #2c2c2a;
    --axis: #383835;
    --border: rgba(255, 255, 255, 0.10);
    --wash: rgba(255, 255, 255, 0.05);
    --track: rgba(255, 255, 255, 0.10);
    --c-Prompt: #3987e5;
    --c-Toolcall: #d95926;
    --c-MCP: #199e70;
    --c-Skill: #c98500;
    --c-Agent: #d55181;
    --c-Overhead: #008300;
    --delta-up: #eb9a76;
    --delta-down: #86b6ef;
    --main-mark: #5c5b56;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --surface: #1a1a19;
  --plane: #0d0d0d;
  --ink: #ffffff;
  --ink-2: #c3c2b7;
  --muted: #898781;
  --grid: #2c2c2a;
  --axis: #383835;
  --border: rgba(255, 255, 255, 0.10);
  --wash: rgba(255, 255, 255, 0.05);
  --track: rgba(255, 255, 255, 0.10);
  --c-Prompt: #3987e5;
  --c-Toolcall: #d95926;
  --c-MCP: #199e70;
  --c-Skill: #c98500;
  --c-Agent: #d55181;
  --c-Overhead: #008300;
  --delta-up: #eb9a76;
  --delta-down: #86b6ef;
  --main-mark: #5c5b56;
}

/* ---------- page ---------- */
* { box-sizing: border-box; }
html, body { max-width: 100%; overflow-x: hidden; }
body {
  margin: 0;
  background: var(--plane);
  color: var(--ink);
  font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  font-size: 15px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
.wrap { max-width: 1100px; margin: 0 auto; padding: 56px 24px 72px; }
@media (max-width: 700px) { .wrap { padding: 32px 16px 48px; } }

h1 { font-size: 26px; line-height: 1.25; font-weight: 600; letter-spacing: -0.01em; margin: 0; }
h2 { font-size: 17px; font-weight: 600; margin: 0 0 4px; letter-spacing: -0.005em; }
.sub { color: var(--ink-2); font-size: 14px; margin: 0 0 20px; max-width: 68ch; }
.range { color: var(--ink-2); font-size: 14px; margin: 6px 0 0; }

/* ---------- header figures ---------- */
.figures { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 40px; margin: 28px 0 14px; }
.hero-label, .tile-label { color: var(--muted); font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase; }
.hero-value { font-size: 56px; line-height: 1; font-weight: 600; letter-spacing: -0.03em; margin-top: 6px; }
.tile-value { font-size: 22px; font-weight: 600; line-height: 1.2; margin-top: 8px; }
.tile-note { color: var(--muted); font-size: 12px; margin-top: 2px; }

/* ---------- week-over-week delta ---------- */
.delta { white-space: nowrap; font-variant-numeric: tabular-nums; }
.delta.up { color: var(--delta-up); }
.delta.down { color: var(--delta-down); }
.delta-none { color: var(--muted); }
.delta-line { font-size: 13px; margin-top: 8px; }
.delta-line .delta { font-weight: 600; }
.prev-cell { color: var(--muted); }
.prev-delta { font-size: 12px; margin-top: 2px; }
.caption { color: var(--ink-2); font-size: 13.5px; max-width: 78ch; margin: 0; }

/* ---------- tabs ---------- */
.tabs { display: flex; flex-wrap: wrap; gap: 4px; margin: 32px 0 18px; border-bottom: 1px solid var(--grid); }
.tab {
  appearance: none; background: none; border: 0; border-bottom: 2px solid transparent;
  font: inherit; font-size: 14px; font-weight: 500; color: var(--muted);
  padding: 10px 14px; margin-bottom: -1px; cursor: pointer; border-radius: 6px 6px 0 0;
}
.tab:hover { color: var(--ink-2); background: var(--wash); }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--ink); font-weight: 600; }
.tab:focus-visible { outline: 2px solid var(--c-Prompt); outline-offset: 2px; }

/* ---------- cards ---------- */
.card {
  background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
  padding: 24px; margin-bottom: 20px;
}
@media (max-width: 700px) { .card { padding: 16px; } }
/* ---------- legend ---------- */
.legend { display: flex; flex-wrap: wrap; gap: 6px 18px; margin: 4px 0 18px; }
.legend-item { display: inline-flex; align-items: center; gap: 7px; font-size: 13px; color: var(--ink-2); }
.swatch { width: 10px; height: 10px; border-radius: 3px; flex: 0 0 auto; }

/* ---------- donut ---------- */
.donut-wrap { text-align: center; margin: 4px 0 26px; }
.donut { width: 100%; max-width: 320px; height: auto; display: block; margin: 0 auto; }
.donut path { transition: opacity 120ms ease; }
.donut path:hover, .donut path:focus { opacity: 0.82; outline: none; }
.donut-center-value { font-size: 26px; font-weight: 600; letter-spacing: -0.02em; }
.donut-center-label { font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; }

/* ---------- tables ---------- */
.tw { overflow-x: auto; -webkit-overflow-scrolling: touch; }
table { width: 100%; min-width: 560px; border-collapse: collapse; font-size: 14px; }
thead th {
  text-align: left; font-weight: 600; font-size: 11px; color: var(--muted);
  letter-spacing: 0.06em; text-transform: uppercase;
  padding: 0 9px 10px; border-bottom: 1px solid var(--grid); white-space: nowrap;
}
tbody td { padding: 13px 9px; border-bottom: 1px solid var(--grid); vertical-align: top; }
tbody tr:last-child td { border-bottom: 0; }
th.num, td.num { text-align: right; font-variant-numeric: tabular-nums; }
td.num { white-space: nowrap; }
td.when { white-space: nowrap; }
.name-cell { display: flex; align-items: baseline; gap: 9px; }
.name-cell .swatch { margin-top: 5px; }
.cat-name { font-weight: 600; }
.desc { color: var(--muted); font-size: 12.5px; margin-top: 2px; max-width: 46ch; }
.muted { color: var(--muted); }
.dim td { color: var(--muted); }
.dim .strong { color: var(--ink-2); }
.tnote { color: var(--muted); font-size: 12.5px; margin: 14px 0 0; max-width: 74ch; }

/* ---------- percent bar ---------- */
.pbar-cell { min-width: 132px; width: 132px; }
.pbar-row { display: flex; align-items: center; gap: 10px; }
.pbar-num { font-variant-numeric: tabular-nums; font-size: 13px; width: 40px; text-align: right; flex: 0 0 auto; }
.pbar { position: relative; height: 6px; flex: 1 1 auto; min-width: 44px; background: var(--track); border-radius: 4px; }
.pbar > i { position: absolute; inset: 0 auto 0 0; border-radius: 2px 4px 4px 2px; display: block; }

/* ---------- stacked mini bar (composition) ---------- */
.mini { display: flex; gap: 2px; height: 9px; min-width: 88px; width: 96px; }
.mini > span { min-width: 2px; border-radius: 1px; }
.mini > span:first-child { border-radius: 4px 1px 1px 4px; }
.mini > span:last-child { border-radius: 1px 4px 4px 1px; }
.mini.empty { background: var(--track); border-radius: 4px; }
.comp-cell { display: flex; align-items: center; gap: 10px; }
.comp-label { font-size: 12.5px; color: var(--ink-2); white-space: nowrap; font-variant-numeric: tabular-nums; }

/* ---------- day chart ---------- */
.daywrap { margin-top: 2px; }
.daygroups { display: flex; gap: 8px; margin-bottom: 12px; }
.daygroup {
  min-width: 0; text-align: center; font-size: 11px; letter-spacing: 0.06em;
  text-transform: uppercase; color: var(--muted); padding-bottom: 6px;
  border-bottom: 1px solid var(--grid);
}
.daygroup.cur { color: var(--ink-2); }
.daychart { display: flex; align-items: flex-end; gap: 8px; height: 190px; }
.daycol { flex: 1 1 0; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; min-width: 0; }
.daycap { font-size: 12px; color: var(--ink-2); font-variant-numeric: tabular-nums; margin-bottom: 6px; white-space: nowrap; }
.daybar { width: 24px; max-width: 100%; display: flex; flex-direction: column; }
.daybar > span { display: block; width: 100%; }
.daybar > span:first-child { border-radius: 4px 4px 0 0; }
.daybar > span:hover, .daybar > span:focus { opacity: 0.82; outline: none; }
.daycol.prev .daybar { opacity: 0.42; }
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) .daycol.prev .daybar { opacity: 0.55; }
}
:root[data-theme="dark"] .daycol.prev .daybar { opacity: 0.55; }
.daycol.prev .daycap { color: var(--muted); }
.daycol.boundary, .daylabel.boundary { border-left: 1px solid var(--axis); }
.dayzero { width: 24px; height: 2px; background: var(--axis); border-radius: 1px; }
.dayaxis { display: flex; gap: 8px; border-top: 1px solid var(--axis); padding-top: 8px; }
.daylabel { flex: 1 1 0; text-align: center; font-size: 12px; color: var(--ink-2); min-width: 0; font-variant-numeric: tabular-nums; }
.daylabel .dow { display: block; font-size: 11px; color: var(--muted); }
.daylabel.prev { color: var(--muted); }
.daylabel small { display: block; color: var(--muted); font-size: 11px; }

/* ---------- session rows ---------- */
.sess-head { display: flex; align-items: baseline; gap: 8px; }
.toggle {
  appearance: none; background: none; border: 1px solid var(--border); border-radius: 6px;
  color: var(--ink-2); font: inherit; font-size: 11px; line-height: 1; cursor: pointer;
  width: 20px; height: 20px; flex: 0 0 auto; display: inline-flex; align-items: center; justify-content: center;
  margin-top: 2px;
}
.toggle:hover { background: var(--wash); color: var(--ink); }
.toggle:focus-visible { outline: 2px solid var(--c-Prompt); outline-offset: 1px; }
.no-toggle { width: 20px; flex: 0 0 auto; }
.project { font-weight: 600; }
.snippet { color: var(--ink-2); font-size: 13px; margin-top: 3px; max-width: 44ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pill {
  display: inline-block; font-size: 10.5px; letter-spacing: 0.04em; text-transform: uppercase;
  color: var(--ink-2); border: 1px solid var(--border); border-radius: 999px; padding: 1px 8px; margin-left: 8px;
  vertical-align: 1px; white-space: nowrap;
}
tr.top-session > td { background: var(--wash); }
tr.top-session > td:first-child { box-shadow: inset 3px 0 0 var(--ink); }
.agents-cell { background: var(--wash); padding: 0 10px 14px 39px; }
.agents-title { font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); padding: 10px 0 8px; }
table.agents { min-width: 0; width: auto; font-size: 13px; }
table.agents td { padding: 5px 22px 5px 0; border: 0; }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px; color: var(--ink-2); }

/* ---------- empty state ---------- */
.empty { text-align: center; padding: 56px 24px; margin-top: 28px; }
.empty h2 { font-size: 19px; margin-bottom: 8px; }
.empty p { color: var(--ink-2); margin: 0 auto; max-width: 46ch; }

/* ---------- footer ---------- */
footer { margin-top: 36px; padding-top: 20px; border-top: 1px solid var(--grid); color: var(--muted); font-size: 12.5px; }
footer p { margin: 0 0 5px; }

/* ---------- tooltip ---------- */
#tip {
  position: fixed; z-index: 50; pointer-events: none; opacity: 0;
  transform: translate(-50%, -100%); transition: opacity 90ms ease;
  background: var(--surface); color: var(--ink); border: 1px solid var(--border);
  border-radius: 8px; padding: 8px 10px; font-size: 12.5px; line-height: 1.45;
  box-shadow: 0 6px 20px rgba(0, 0, 0, 0.16); max-width: 260px; white-space: pre-line;
}
#tip.on { opacity: 1; }
.tip-key { display: inline-block; width: 9px; height: 9px; border-radius: 3px; margin-right: 6px; }

@media print { .tabs { display: none; } [role="tabpanel"] { display: block !important; } }

      var fresh = day.fresh || 0;
      var by = day.byCategory || {};
      var label = localDate(day.date);
      var isPrev = day.week === "previous";
      var when = fmtDay(label) + (isPrev ? " (previous 7 days)" : "");
      var barH = max > 0 ? Math.round(fresh / max * PLOT) : 0;
      var body;
      if (fresh <= 0 || barH < 1) {
        body = '<div class="dayzero" tabindex="0" data-tip="' + esc(when + "\nNo activity") + '"></div>';
      } else {
        var parts = CATS.filter(function (c) { return (by[c] || 0) > 0; });
        // 2px surface gaps do the separating; on a very short bar they would
        // inflate it, so the gap narrows rather than the bar lying about its size.
        var gapPx = parts.length < 2 ? 0 : (barH >= parts.length * 5 ? 2 : 1);
        var gaps = (parts.length - 1) * gapPx;
        var avail = Math.max(barH - gaps, parts.length);
        var hs = parts.map(function (c) { return Math.max(1, Math.round((by[c] || 0) / fresh * avail)); });
        var sum = hs.reduce(function (a, b) { return a + b; }, 0);
        hs[hs.length - 1] = Math.max(1, hs[hs.length - 1] + (avail - sum));
        // topmost stacked segment first in the DOM (column grows downward visually)
        body = '<div class="daybar" style="gap:' + gapPx + 'px">' + parts.map(function (c, k) {
          return '<span style="height:' + hs[k] + "px;background:" + catVar(c) + '" tabindex="0" data-tip="' +
            esc(when + " — " + c + "\n" + fmt(by[c]) + " fresh · " + pctText(share(by[c], fresh)) + " of the day") + '"></span>';
        }).reverse().join("") + "</div>";
      }
      var cls = "daycol" + (isPrev ? " prev" : "") + (di === firstCurrent ? " boundary" : "");
      return '<div class="' + cls + '"><div class="daycap">' + (fresh > 0 ? fmt(fresh) : "0") + "</div>" + body + "</div>";
    }).join("");

    var axis = m.days.map(function (day, di) {
      var label = localDate(day.date);
      var cls = "daylabel" + (day.week === "previous" ? " prev" : "") + (di === firstCurrent ? " boundary" : "");
      return '<div class="' + cls + '"><span class="dow">' +
        esc(label.toLocaleDateString(undefined, { weekday: "short" })) + "</span>" +
        label.getDate() + (day.partial ? "<small>(partial)</small>" : "") + "</div>";
    }).join("");

    var groups = twoWindows
      ? '<div class="daygroups">' +
        '<div class="daygroup prev" style="flex:' + prevCount + ' 1 0">Previous 7 days</div>' +
        '<div class="daygroup cur" style="flex:' + curCount + ' 1 0">This Week</div></div>'
      : "";

    return '<div class="card"><h2>Fresh tokens per day</h2>' +
      '<p class="sub">' + (twoWindows
        ? "Two rolling windows side by side: the previous 7 days, muted, then this Week."
        : "The Week is the trailing 7 days, so the oldest day starts part-way through — it is marked partial rather than hidden.") +
      "</p>" +
      legend(m.presentCats) +
      '<div class="daywrap" style="max-width:' + wrapWidth + 'px">' +
      groups +
      '<div class="daychart">' + cols + "</div>" +
      '<div class="dayaxis">' + axis + "</div></div>" +
      '<p class="tnote">Each column is one calendar day in your local time, stacked by Category. Totals sit above each column' +
      (twoWindows ? ", and both windows share one scale so the heights compare directly. The oldest day starts part-way through, so it is marked partial rather than hidden." : ".") +
      (splitDay ? " " + esc(splitDay) + " appears twice because the Week begins part-way through it — the muted column is the part that fell in the previous 7 days." : "") +
      "</p>" +
      "</div>";
  }

  function viewSkill(m) {
    if (!m.skills.length) {
      return '<div class="card"><h2>Skill runs</h2><p class="muted">No skills ran in this Week.</p></div>';
    }
    var rows = m.skills.map(function (s) {
      var noSkill = /^\(no skill\)$/i.test(s.name || "");
      var comp = s.composition || { main: 0, agents: 0 };
      var compTotal = (comp.main || 0) + (comp.agents || 0);
      var agentPct = share(comp.agents, compTotal);
      return "<tr" + (noSkill || isGone(s) ? ' class="dim"' : "") + ">" +
        "<td>" + (noSkill
          ? '<span class="strong">(no skill)</span><div class="desc">requests that ran outside any skill</div>'
          : '<span class="cat-name">' + esc(s.name) + "</span>") + "</td>" +
        '<td class="num">' + (s.runs > 0 ? int(s.runs) : "—") + "</td>" +
        '<td class="num">' + (s.runs > 0 ? fmt(s.avgFreshPerRun) : "—") + "</td>" +
        '<td class="num">' + fmt(s.fresh) + "</td>" +
        '<td class="pbar-cell">' + pbar(share(s.fresh, m.total), noSkill ? "var(--muted)" : "var(--ink-2)") + "</td>" +
        (m.hasPrev ? prevCell(s.prevFresh, s.fresh) : "") +
        '<td><div class="comp-cell">' +
        (compTotal > 0
          ? '<div class="mini">' +
            '<span style="flex:' + ((comp.main || 0) / compTotal * 1000).toFixed(3) + ' 1 0;background:var(--main-mark)" tabindex="0" data-tip="' +
              esc("Main conversation\n" + fmt(comp.main) + " fresh · " + pctText(share(comp.main, compTotal))) + '"></span>' +
            '<span style="flex:' + ((comp.agents || 0) / compTotal * 1000).toFixed(3) + ' 1 0;background:' + catVar("Agent") + '" tabindex="0" data-tip="' +
              esc("Agents\n" + fmt(comp.agents) + " fresh · " + pctText(agentPct)) + '"></span></div>' +
            '<span class="comp-label">' + pctText(agentPct) + " agents</span>"
          : '<div class="mini empty"></div><span class="comp-label muted">—</span>') +
        "</div></td></tr>";
    }).join("");

    return '<div class="card"><h2>Skill runs</h2>' +
      '<p class="sub">A Skill run counts everything the skill caused, including agents it spawned.</p>' +
      '<div class="legend"><span class="legend-item"><span class="swatch" style="background:var(--main-mark)"></span>Main conversation</span>' +
      '<span class="legend-item">' + swatch("Agent") + "Agents</span></div>" +
      '<div class="tw"><table><thead><tr>' +
      "<th>Skill</th><th class=\"num\">Runs</th><th class=\"num\">Avg / run</th><th class=\"num\">Total fresh</th><th>% of Week</th>" +
      (m.hasPrev ? prevHeader() : "") +
      "<th>Made up of</th>" +
      "</tr></thead><tbody>" + rows + "</tbody></table></div>" +
      '<p class="tnote">This measures what invoking a skill actually cost, not how long its instructions are. “(no skill)” is everything that ran outside a skill, so the list still adds up to the whole Week.</p>' +
      "</div>";
  }

  function viewModel(m) {
    if (!m.models.length) {
      return '<div class="card"><h2>Models</h2><p class="muted">No model information recorded in this Week.</p></div>';
    }
    var rows = m.models.map(function (x) {
      return "<tr" + (isGone(x) ? ' class="dim"' : "") + ">" +
        '<td><span class="mono">' + esc(x.name) + "</span></td>" +
        '<td class="num">' + fmt(x.fresh) + "</td>" +
        '<td class="pbar-cell">' + pbar(share(x.fresh, m.total), "var(--ink-2)") + "</td>" +
        (m.hasPrev ? prevCell(x.prevFresh, x.fresh) : "") +
        '<td class="num muted">' + fmt(x.cacheRead) + "</td>" +
        '<td class="num muted">' + int(x.requests) + "</td>" +
        "</tr>";
    }).join("");

    return '<div class="card"><h2>Which models did the work</h2>' +
      '<p class="sub">The same Week split by the model that answered each request — main conversation and subagents together.</p>' +
      '<div class="tw"><table><thead><tr>' +
      "<th>Model</th><th class=\"num\">Fresh</th><th>% of Week</th>" +
      (m.hasPrev ? prevHeader() : "") +
      "<th class=\"num\">Cache reads</th><th class=\"num\">Requests</th>" +
      "</tr></thead><tbody>" + rows + "</tbody></table></div>" +
      '<p class="tnote">Model ids are exactly as the API reported them, date suffixes included. A row marked “gone” ran only in the previous 7 days; “new” means it appeared this Week.</p>' +
      "</div>";
  }

  /* ------------------------------ shell ----------------------------- */
  var TABS = [
    { id: "category", label: "By Category", view: viewCategory },
    { id: "session", label: "By Session", view: viewSession },
    { id: "day", label: "By Day", view: viewDay },
    { id: "skill", label: "By Skill", view: viewSkill },
    { id: "model", label: "By Model", view: viewModel }
  ];

  function model(data) {
    data = data || {};
    var totals = data.totals || {};
    var total = Number(totals.fresh) || 0;
    var byName = {};
    (data.categories || []).forEach(function (c) { if (c && c.name) byName[c.name] = c; });
    var cats = CATS.map(function (n) {
      var c = byName[n] || {};
      return {
        name: n,
        fresh: Number(c.fresh) || 0,
        cacheRead: Number(c.cacheRead) || 0,
        requests: Number(c.requests) || 0,
        prevFresh: Number(c.prevFresh) || 0,
        servers: Array.isArray(c.servers) ? c.servers : []
      };
    });
    // Previous Week total: from totals when the core sends it, else derived.
    var prevTotal = Number(totals.prevFresh) || 0;
    if (!prevTotal) prevTotal = cats.reduce(function (a, c) { return a + c.prevFresh; }, 0);

    return {
      raw: data,
      totals: totals,
      total: total,
      prevTotal: prevTotal,
      hasPrev: prevTotal > 0,
      cats: cats,
      presentCats: cats.filter(function (c) { return c.fresh > 0; }).map(function (c) { return c.name; }),
      days: (data.days || []).slice(),
      sessions: (data.sessions || []).slice().sort(function (a, b) { return (b.fresh || 0) - (a.fresh || 0); }),
      skills: (data.skills || []).slice(),
      models: (data.models || []).slice().sort(function (a, b) { return (b.fresh || 0) - (a.fresh || 0); })
    };
  }

  function header(m, bare) {
    var ws = d(m.raw.weekStart), we = d(m.raw.weekEnd);
    var range = (ws && we)
      ? fmtDay(ws) + " – " + fmtDayYear(we)
      : "the last 7 days";
    if (bare) {
      return "<header><h1>Where did my Claude tokens go?</h1>" +
        '<p class="range">Week of ' + esc(range) + " · the trailing 7 days, not a calendar week</p></header>";
    }
    var cache = Number(m.totals.cacheRead) || 0;
    var reqs = Number(m.totals.requests) || 0;
    var sess = Number(m.totals.sessions) || m.sessions.length || 0;

    return "<header><h1>Where did my Claude tokens go?</h1>" +
      '<p class="range">Week of ' + esc(range) + " · the trailing 7 days, not a calendar week</p>" +
      '<div class="figures">' +
      '<div><div class="hero-label">Fresh tokens</div><div class="hero-value">' + fmt(m.total) + "</div>" +
      (m.hasPrev
        ? '<div class="delta-line">' + deltaBadge(m.total, m.prevTotal) +
          ' <span class="muted">vs previous 7 days (' + fmt(m.prevTotal) + ")</span></div>"
        : "") +
      "</div>" +
      '<div><div class="tile-label">Cache reads</div><div class="tile-value">' + fmt(cache) + '</div><div class="tile-note">≈ 10% of the cost</div></div>' +
      '<div><div class="tile-label">Requests</div><div class="tile-value">' + int(reqs) + '</div><div class="tile-note">across ' + plural(sess, "session") + "</div></div>" +
      "</div>" +
      '<p class="caption">Fresh tokens are everything Claude processed at full price — your prompts, tool results and subagents. Cache reads are context replayed from cache at roughly a tenth of the cost, so they are reported separately and never added in.</p>' +
      "</header>";
  }

  function footer(m) {
    var g = d(m.raw.generatedAt);
    var skipped = Number(m.raw.skippedRecords) || 0;
    return "<footer>" +
      "<p>Generated " + (g ? esc(fmtStamp(g)) : "just now") + ".</p>" +
      (skipped > 0 ? "<p>" + int(skipped) + " record" + (skipped === 1 ? "" : "s") + " skipped (unrecognized format).</p>" : "") +
      "<p>claude-analyzer — reads your local Claude Code transcripts; nothing leaves this machine.</p>" +
      "</footer>";
  }

  function isEmpty(m) {
    return !(m.total > 0) && !(Number(m.totals.requests) > 0) && m.sessions.length === 0;
  }

  function render() {
    var m = model(DATA);
    var app = document.getElementById("app");

    if (isEmpty(m)) {
      app.innerHTML = header(m, true) +
        '<div class="card empty"><h2>No Claude Code activity in the last 7 days</h2>' +
        "<p>Nothing to report — there are no transcripts with requests inside this Week. Run this again after your next Claude Code session.</p></div>" +
        footer(m);
      return;
    }

    var tabsHtml = '<div class="tabs" role="tablist" aria-label="Grouping">' + TABS.map(function (t, i) {
      return '<button class="tab" type="button" role="tab" id="tab-' + t.id + '" aria-controls="panel-' + t.id +
        '" aria-selected="' + (i === 0) + '" data-tab="' + t.id + '">' + esc(t.label) + "</button>";
    }).join("") + "</div>";

    var panels = TABS.map(function (t, i) {
      return '<section role="tabpanel" id="panel-' + t.id + '" aria-labelledby="tab-' + t.id + '" tabindex="0"' +
        (i === 0 ? "" : " hidden") + ">" + t.view(m) + "</section>";
    }).join("");

    app.innerHTML = header(m) + tabsHtml + panels + footer(m);

    // tab switching
    app.querySelectorAll("[data-tab]").forEach(function (btn) {
      btn.addEventListener("click", function () { select(btn.getAttribute("data-tab")); });
      btn.addEventListener("keydown", function (e) {
        var i = TABS.findIndex(function (t) { return t.id === btn.getAttribute("data-tab"); });
        var next = e.key === "ArrowRight" ? i + 1 : (e.key === "ArrowLeft" ? i - 1 : -1);
        if (next < 0 || next >= TABS.length) return;
        e.preventDefault();
        var id = TABS[next].id;
        select(id);
        document.getElementById("tab-" + id).focus();
      });
    });

    function select(id) {
      TABS.forEach(function (t) {
        var on = t.id === id;
        document.getElementById("tab-" + t.id).setAttribute("aria-selected", String(on));
        document.getElementById("panel-" + t.id).hidden = !on;
      });
      hideTip();
    }

    // agent expand / collapse
    app.querySelectorAll("[data-toggle]").forEach(function (btn) {
      btn.addEventListener("click", function (e) {
        e.preventDefault();
        e.stopPropagation();
        var row = document.getElementById(btn.getAttribute("data-toggle"));
        if (!row) return;
        var open = !row.hidden;
        row.hidden = open;
        btn.setAttribute("aria-expanded", String(!open));
        btn.textContent = open ? "+" : "−";
        btn.title = (open ? "Show " : "Hide ") + (btn.getAttribute("data-label") || "details");
      });
    });
  }

  /* ----------------------------- tooltip ---------------------------- */
  var tip = document.getElementById("tip");
  function showTip(el, x, y) {
    var text = el.getAttribute("data-tip");
    if (!text) return;
    tip.textContent = text;
    tip.classList.add("on");
    var pad = 12;
    var r = tip.getBoundingClientRect();
    var left = Math.min(Math.max(x, r.width / 2 + pad), window.innerWidth - r.width / 2 - pad);
    var top = Math.max(y - 10, r.height + pad);
    tip.style.left = left + "px";
    tip.style.top = top + "px";
  }
  function hideTip() { tip.classList.remove("on"); }

  document.addEventListener("mousemove", function (e) {
    var el = e.target && e.target.closest ? e.target.closest("[data-tip]") : null;
    if (el) showTip(el, e.clientX, e.clientY); else hideTip();
  });
  document.addEventListener("focusin", function (e) {
    var el = e.target && e.target.closest ? e.target.closest("[data-tip]") : null;
    if (!el) return hideTip();
    var b = el.getBoundingClientRect();
    showTip(el, b.left + b.width / 2, b.top);
  });
  document.addEventListener("focusout", hideTip);
  document.addEventListener("scroll", hideTip, true);
  window.addEventListener("resize", hideTip);

  render();
})();
</script>
</body>
</html>
